# ==========================================
# 1. 공통 & 로컬(기본) 설정 (H2 사용)
# ==========================================
spring:
  application:
    name: backend

  # 기본 프로필 지정 (아무 설정 안 하고 띄우면 local로 동작)
  profiles:
    active: local

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

jwt:
  # 32자 이상의 기본값을 부여하여 환경변수가 없어도 테스트/로컬이 터지지 않게 수정
  secret: ${JWT_SECRET:moneylog-jwt-secret-key-for-test-environment-must-be-very-long-32bytes}
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

---
# ==========================================
# 2. EC2/Docker 배포용 설정 (prod 프로필 전용)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  # H2 콘솔 끄기
  h2:
    console:
      enabled: false

  # MySQL 설정 (환경변수가 없으면 기본값으로 docker-compose 서비스명 연결)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://moneylog-db:3306/moneylog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:moneylog_user}
    password: ${SPRING_DATASOURCE_PASSWORD:moneylog_password}

  jpa:
    hibernate:
      ddl-auto: update  # prod 환경에서는 DB 안 날아가게 update 설정!
    show-sql: false